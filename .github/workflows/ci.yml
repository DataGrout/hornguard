name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a changed builtin in SWI's development branch surfaces here
    # months before it reaches a stable release a host is running.
    - cron: '0 6 * * 1'

jobs:
  # The version the profiles were attested on, and a supported version in
  # its own right: 9.2.9 is what a distribution's stable package and many
  # hosts run, and it stays in the matrix for as long as that is true. The
  # PPA jobs below track the engine's present and future; this one is the
  # baseline they are compared against, so a builtin that changed character
  # shows up as a difference between two runs rather than a snapshot of one.
  # It is also the only job on which the profile-currency check can run,
  # since that check only means something on the version the profile header
  # records.
  attested:
    name: suite (swi 9.2.9, attested)
    runs-on: ubuntu-latest
    container: swipl:9.2.9
    steps:
      - name: Tools the image lacks
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swipl --version

      - uses: actions/checkout@v4

      - name: Fixtures, policy, generated terms, worker
        run: |
          make test-fixtures
          make test-policy
          make test-generated
          make test-worker

      - name: Sandbox differential
        run: make test-differential

      - name: Attestation
        run: make test-attest

      - name: Composition and triage
        run: |
          make test-compose
          make test-triage

      # On the attested version, regenerating the profile must reproduce it
      # exactly. A difference here is the file having drifted from the
      # generator, not the engine having moved.
      - name: Generated profile is current
        run: |
          recorded=$(sed -n 's/.*against SWI-Prolog \([0-9][0-9.]*\)\..*/\1/p' profiles/swi.pl | head -1)
          running=$(swipl --version | sed -n 's/.*version \([0-9][0-9.]*\).*/\1/p')
          if [ "$recorded" != "$running" ]; then
            echo "profiles/swi.pl records SWI-Prolog $recorded but this job runs $running; pin this job to the attested version."
            exit 1
          fi
          make gen-profiles
          git diff --exit-code -- profiles/swi.pl \
            || (echo "profiles/swi.pl is stale; run make gen-profiles and review the diff" && exit 1)

  # The engine's present (the PPA's stable channel) and its future (devel).
  # Both engines are installed here, so the engine attestation and the
  # cross-engine reader fixtures run on these jobs and not above.
  suite:
    name: suite (swi ${{ matrix.swi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swi: [stable, devel]
    steps:
      - uses: actions/checkout@v4

      - name: Install SWI-Prolog (${{ matrix.swi }})
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo apt-add-repository -y ppa:swi-prolog/${{ matrix.swi }}
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      # Both engines are optional: the reader-agreement fixtures run against
      # an engine when it is on PATH and skip it otherwise. A third-party
      # build breaking is worth a warning in the log, not a red suite.
      - name: Install Scryer Prolog
        continue-on-error: true
        run: cargo install scryer-prolog --locked

      - name: Build Trealla
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/trealla-prolog/trealla.git /tmp/trealla
          sudo apt-get install -y libreadline-dev
          make -C /tmp/trealla -j"$(nproc)" NOFFI=1 NOSSL=1
          sudo install /tmp/trealla/tpl /usr/local/bin/tpl
          tpl --version

      - name: Fixtures, policy, generated terms, worker
        run: |
          make test-fixtures
          make test-policy
          make test-generated
          make test-worker

      # The differential compares Hornguard with the engine's own
      # library(sandbox). On the development branch a disagreement means a
      # builtin changed character, which is exactly what this job is for.
      - name: Sandbox differential
        run: make test-differential

      # Attestation by experiment: every allowed predicate is called with
      # tripwires around it. On the development branch a new impurity is a
      # builtin that changed behaviour, caught before the release a host runs.
      - name: Attestation
        run: make test-attest

      # The same experiment inside Scryer and Trealla, when their installs
      # above succeeded; an engine that is not on PATH is skipped, not failed.
      - name: Engine attestation
        run: make test-attest-engines

      # Terms the judge admits, run with the attestation's tripwires: a wire
      # on an admitted term is a composition the judge got wrong.
      - name: Admit-then-run fuzzing
        run: make test-fuzz

      - name: Composition
        run: make test-compose

      - name: Triage
        run: make test-triage

      # What this engine would generate, against what the attested one did.
      # The attested job above is the one that fails on a stale profile;
      # here a difference is the engine having moved, reported for a
      # maintainer to read alongside the differential, never a failure.
      - name: Generated profile drift, informational
        if: matrix.swi == 'stable'
        continue-on-error: true
        run: |
          make gen-profiles
          git diff --stat -- profiles/swi.pl
          git diff --exit-code -- profiles/swi.pl \
            || echo "this engine would generate a different profiles/swi.pl than the attested version did; read the diff with the differential above"
          git checkout -- profiles/swi.pl

      # The engine manifests come from probes run inside Scryer and Trealla,
      # whose versions the runner does not pin. A difference is reported for
      # a maintainer to look at, never a failure.
      - name: Engine manifests, informational
        if: matrix.swi == 'stable'
        continue-on-error: true
        run: |
          make manifests
          git diff --exit-code -- profiles/engine_scryer.pl profiles/engine_trealla.pl \
            || echo "an engine manifest differs from the committed one; the engine on this runner is newer or older than the one it was generated from"

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get install -y swi-prolog-nox
      # Every disabled rule of the walk must fail the suite. A surviving
      # mutant means a rule no fixture exercises.
      - run: make mutation

  crate:
    name: rust client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get install -y swi-prolog-nox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make test-crate
