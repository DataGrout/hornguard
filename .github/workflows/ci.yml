name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a changed builtin in SWI's development branch surfaces here
    # months before it reaches a stable release a host is running.
    - cron: '0 6 * * 1'

jobs:
  suite:
    name: suite (swi ${{ matrix.swi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swi: [stable, devel]
    steps:
      - uses: actions/checkout@v4

      - name: Install SWI-Prolog (${{ matrix.swi }})
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo apt-add-repository -y ppa:swi-prolog/${{ matrix.swi }}
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      # Both engines are optional: the reader-agreement fixtures run against
      # an engine when it is on PATH and skip it otherwise. A third-party
      # build breaking is worth a warning in the log, not a red suite.
      - name: Install Scryer Prolog
        continue-on-error: true
        run: cargo install scryer-prolog --locked

      - name: Build Trealla
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/trealla-prolog/trealla.git /tmp/trealla
          sudo apt-get install -y libreadline-dev
          make -C /tmp/trealla -j"$(nproc)" NOFFI=1 NOSSL=1
          sudo install /tmp/trealla/tpl /usr/local/bin/tpl
          tpl --version

      - name: Fixtures, policy, generated terms, worker
        run: |
          make test-fixtures
          make test-policy
          make test-generated
          make test-worker

      # The differential compares Hornguard with the engine's own
      # library(sandbox). On the development branch a disagreement means a
      # builtin changed character, which is exactly what this job is for.
      - name: Sandbox differential
        run: make test-differential

      # Attestation by experiment: every allowed predicate is called with
      # tripwires around it. On the development branch a new impurity is a
      # builtin that changed behaviour, caught before the release a host runs.
      - name: Attestation
        run: make test-attest

      # The same experiment inside Scryer and Trealla, when their installs
      # above succeeded; an engine that is not on PATH is skipped, not failed.
      - name: Engine attestation
        run: make test-attest-engines

      # Terms the judge admits, run with the attestation's tripwires: a wire
      # on an admitted term is a composition the judge got wrong.
      - name: Admit-then-run fuzzing
        run: make test-fuzz

      - name: Composition
        run: make test-compose

      # The committed profile records the engine version it was generated
      # against. On that version, regenerating must reproduce it. On any
      # other, a difference is the engine having changed, which the
      # differential above already reports, so the check says so and passes
      # rather than going red for every benign addition in a newer engine.
      - name: Generated profile is current
        if: matrix.swi == 'stable'
        run: |
          recorded=$(sed -n 's/.*against SWI-Prolog \([0-9][0-9.]*\)\..*/\1/p' profiles/swi.pl | head -1)
          running=$(swipl --version | sed -n 's/.*version \([0-9][0-9.]*\).*/\1/p')
          if [ "$recorded" != "$running" ]; then
            echo "profiles/swi.pl was generated against SWI-Prolog $recorded; this runner has $running."
            echo "Skipping the currency check; the differential above is the one that matters here."
            exit 0
          fi
          make gen-profiles
          git diff --exit-code -- profiles/swi.pl \
            || (echo "profiles/swi.pl is stale; run make gen-profiles and review the diff" && exit 1)

      # The engine manifests come from probes run inside Scryer and Trealla,
      # whose versions the runner does not pin. A difference is reported for
      # a maintainer to look at, never a failure.
      - name: Engine manifests, informational
        if: matrix.swi == 'stable'
        continue-on-error: true
        run: |
          make manifests
          git diff --exit-code -- profiles/engine_scryer.pl profiles/engine_trealla.pl \
            || echo "an engine manifest differs from the committed one; the engine on this runner is newer or older than the one it was generated from"

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get install -y swi-prolog-nox
      # Every disabled rule of the walk must fail the suite. A surviving
      # mutant means a rule no fixture exercises.
      - run: make mutation

  crate:
    name: rust client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get install -y swi-prolog-nox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make test-crate
